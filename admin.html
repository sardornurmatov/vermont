<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vermont — Admin</title><link rel="stylesheet" href="css/admin.css"></head>
<body>
  <main class="admin-shell">
    <section id="loginPanel" class="admin-card">
      <div class="admin-logo">V</div><h1>Vermont Admin</h1><p>Davom etish uchun admin parolini kiriting.</p>
      <form id="adminLoginForm"><input id="adminPassword" type="password" placeholder="Admin paroli" required><button type="submit">Kirish</button><div id="adminError" class="error"></div></form>
    </section>
    <section id="dashboardPanel" class="dashboard" hidden>
      <header><div><p class="eyebrow">VERMONT SHOP</p><h1>Boshqaruv paneli</h1></div><button id="logoutAdmin" class="secondary">Chiqish</button></header>
      <div id="stats" class="stats"></div>
      <section class="panel"><div class="panel-title"><h2>Mahsulotlar</h2><button id="refreshProducts" class="secondary">Yangilash</button></div><div class="table-wrap"><table><thead><tr><th>Nomi</th><th>Narxi</th><th>Ombor</th><th>Sotilgan</th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
    </section>
  </main>
  <script src="js/config.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script>
</body>
</html>
